<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CPIT405 - Assignment 2 - Country Explorer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="header">
      <h1 class="title">Country Explorer 🌍</h1>
      <p class="subtitle">
        Type a country name and fetch information from a public API using <code>fetch()</code>.
      </p>
    </header>

    <main>
      <section class="search-section">
        <label for="countryInput">Country name:</label>
        <input
          type="text"
          id="countryInput"
          placeholder="e.g. Saudi Arabia"
        />
        <button id="searchBtn">Search</button>
      </section>

      <p id="message" class="message"></p>

      <section id="result" class="card hidden"></section>
    </main>

    <footer class="footer">
      <p>Developed by <b>Joud Alzahrani</b> – CPIT405 Assignment 2</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
